<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Share</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="pixelCanvas"></canvas>
    <div class="container">
        <header>
            <h1>Code Share</h1>
            <button class="add-btn" id="addBtn">+</button>
        </header>

        <div class="snippets-list" id="snippetsList"></div>

        <div class="modal" id="modal">
            <div class="modal-content">
                <span class="close" id="closeModal">&times;</span>
                <h2 id="modalTitle">Новый код</h2>
                <input type="text" id="snippetName" placeholder="Название кода" class="input-name">
                <textarea id="codeInput" placeholder="Вставь свой код здесь..."></textarea>
                <button class="save-btn" id="saveBtn">Сохранить</button>
            </div>
        </div>

        <div class="view-modal" id="viewModal">
            <div class="view-modal-content">
                <span class="close" id="closeViewModal">&times;</span>
                <div class="view-header">
                    <h2 id="viewTitle"></h2>
                    <div class="view-actions">
                        <button class="edit-btn" id="editBtn">Изменить</button>
                        <button class="copy-btn" id="copyBtn">Копировать</button>
                        <button class="share-btn" id="shareBtn">Поделиться</button>
                        <button class="delete-btn" id="deleteBtn">Удалить</button>
                    </div>
                </div>
                <div class="share-link" id="shareLink" style="display: none;">
                    <input type="text" id="shareLinkInput" readonly>
                    <button class="copy-link-btn" id="copyLinkBtn">Копировать ссылку</button>
                </div>
                <pre><code id="viewCode"></code></pre>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <script type="module" src="/app.js"></script>
</body>
</html>
